<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Saat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .card {
    text-align: center;
    padding: 2px 20px;
  }
  .time {
    font-size: calc(clamp(24px, 6vw, 48px) * var(--scale, 1));
    font-weight: 700;
    color: #f5f5f5;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .time .sec {
    font-size: 0.5em;
    color: #6b7280;
    vertical-align: super;
  }
  .date {
    margin-top: 0px;
    font-size: calc(clamp(10px, 2vw, 14px) * var(--scale, 1));
    color: #9ca3af;
    text-transform: capitalize;
    letter-spacing: 1px;
  }
  .ayar {
    position: fixed;
    top: 4px;
    right: 4px;
    opacity: 0.25;
    transition: opacity 0.2s;
  }
  .ayar:hover, .ayar:focus-within { opacity: 1; }
  .ayar input {
    width: 60px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="time" id="time">--:--<span class="sec">--</span></div>
    <div class="date" id="date">-</div>
  </div>
  <div class="ayar">
    <input type="range" id="boyut" min="0.4" max="1.6" step="0.05" value="1">
  </div>

<script>
  const gunler = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  const aylar = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

  function pad(n) { return n.toString().padStart(2, "0"); }

  function guncelle() {
    const now = new Date();
    const saat = pad(now.getHours());
    const dakika = pad(now.getMinutes());
    const saniye = pad(now.getSeconds());

    document.getElementById("time").innerHTML =
      `${saat}:${dakika}<span class="sec">${saniye}</span>`;

    document.getElementById("date").textContent =
      `${gunler[now.getDay()]}, ${now.getDate()} ${aylar[now.getMonth()]} ${now.getFullYear()}`;
  }

  guncelle();
  setInterval(guncelle, 1000);

  const kaydirici = document.getElementById("boyut");
  const kayitli = localStorage.getItem("saat-boyut");
  if (kayitli) {
    kaydirici.value = kayitli;
    document.documentElement.style.setProperty("--scale", kayitli);
  }
  kaydirici.addEventListener("input", () => {
    document.documentElement.style.setProperty("--scale", kaydirici.value);
    localStorage.setItem("saat-boyut", kaydirici.value);
  });
</script>
</body>
</html>
